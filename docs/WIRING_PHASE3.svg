<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="710" viewBox="0 0 1280 710" role="img" aria-labelledby="title desc">
<title id="title">DriveTrace phase 3 example wiring diagram</title>
<desc id="desc">Hall OUT to GPIO4, MPU6050 SDA to GPIO8 and SCL to GPIO9, GPS TX to GPIO16 RX, optional GPS RX to GPIO17 TX, with shared ground and module-appropriate power.</desc>
<defs>
 <marker id="end" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#3566db"/></marker>
 <style>text{font-family:Arial,sans-serif}.h{font-size:32px;font-weight:bold;fill:#10285c}.sub{font-size:16px;fill:#64799f}.cap{font-size:21px;font-weight:bold;fill:#173a74}.small{font-size:16px;fill:#42587e}.pin{font-size:17px;font-weight:bold;fill:#2459bc}.line{stroke:#3566db;stroke-width:3.2;fill:none;marker-end:url(#end)}.pwr{stroke:#24a0a0;stroke-width:2.7;stroke-dasharray:8 6;fill:none}.box{fill:#fff;stroke:#cddbf2;stroke-width:2}</style>
</defs>
<rect width="1280" height="710" fill="#f8faff"/>
<text class="h" x="55" y="60">DRIVETRACE / PHASE 3</text>
<text class="sub" x="55" y="92">ESP32-S3 example bench wiring · VERIFY exact board pins and voltage before connecting</text>
<rect class="box" x="465" y="145" rx="21" width="335" height="410"/>
<rect x="465" y="145" rx="21" width="335" height="70" fill="#153783"/>
<text x="632" y="187" fill="white" font-size="25" font-family="Arial" font-weight="bold" text-anchor="middle">ESP32-S3</text>
<text class="small" x="502" y="251">USB → PC / local dashboard</text>
<text class="pin" x="502" y="304">GPIO 4 · Hall OUT</text>
<text class="pin" x="502" y="356">GPIO 8 · I2C SDA</text>
<text class="pin" x="502" y="389">GPIO 9 · I2C SCL</text>
<text class="pin" x="502" y="453">GPIO 16 · GPS RX</text>
<text class="pin" x="502" y="486">GPIO 17 · GPS TX*</text>
<text class="pin" x="502" y="533">3V3 / GND · Shared logic</text>
<rect class="box" x="55" y="225" rx="18" width="290" height="148"/>
<text class="cap" x="83" y="266">Hall-effect sensor</text>
<text class="small" x="83" y="294">Wheel rotation / magnet</text>
<text class="small" x="83" y="325">OUT · VCC · GND</text>
<path class="line" d="M345 294 H410 V294 H465"/>
<text class="small" x="358" y="280">OUT → GPIO4</text>
<rect class="box" x="55" y="415" rx="18" width="290" height="148"/>
<text class="cap" x="83" y="456">MPU6050 IMU</text>
<text class="small" x="83" y="484">Raw 3-axis acceleration</text>
<text class="small" x="83" y="515">SDA / SCL · VCC · GND</text>
<path class="line" d="M345 480 H391 V340 H465"/>
<path class="line" d="M345 521 H420 V383 H465"/>
<text class="small" x="354" y="417">SDA / SCL</text>
<rect class="box" x="920" y="282" rx="18" width="295" height="200"/>
<text class="cap" x="948" y="326">NEO-M8N GPS module</text>
<text class="small" x="948" y="358">NMEA RMC speed outdoors</text>
<text class="small" x="948" y="388">TX → GPIO16 (RX)</text>
<text class="small" x="948" y="417">RX* ← GPIO17 (TX)</text>
<text class="small" x="948" y="447">Power: CHECK breakout label</text>
<path class="line" d="M920 385 H800"/>
<path class="line" d="M800 481 H865 V423 H920"/>
<text class="small" x="810" y="365">UART</text>
<path class="pwr" d="M345 348 H382 V595 H775 V533 H800"/>
<text class="small" x="55" y="609">All modules share GND. Supply voltage is module-specific.</text>
<rect x="55" y="633" width="1160" height="56" rx="12" fill="#eaf2ff" stroke="#c5d8ff"/>
<text x="77" y="658" font-family="Arial" font-size="16" fill="#183c81" font-weight="bold">IMPORTANT:</text>
<text x="184" y="658" font-family="Arial" font-size="16" fill="#183c81">ESP32-S3 GPIO is 3.3 V logic, NOT 5 V tolerant. USB bench power only for first test.</text>
<text x="77" y="678" font-family="Arial" font-size="14" fill="#637ca6">* GPS RX-to-GPIO17 is optional. Pin assignments and electrical compatibility must be checked after choosing actual modules.</text>
</svg>
